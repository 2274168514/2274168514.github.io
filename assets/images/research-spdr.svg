<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">S-PDR concept diagram</title>
  <desc id="desc">A conceptual illustration of personal interest, popularity, and bias as separate considerations in recommendation. This is an original explanatory diagram, not a reported model architecture or research result.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#92a9bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="360" height="240" rx="12" fill="#f4f7fa"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="180" y="33" font-size="21" font-weight="700" fill="#245b85">S-PDR</text>
    <g fill="#e3edf5" stroke="#bfd0df" stroke-width="1.5">
      <circle cx="65" cy="83" r="28"/>
      <circle cx="180" cy="83" r="28"/>
      <circle cx="295" cy="83" r="28"/>
    </g>
    <g stroke="#245b85" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="65" cy="76" r="7"/>
      <path d="M52 95c1-14 25-14 26 0"/>
      <path d="M166 95V84m14 11V73m14 22V66"/>
      <path d="M281 77h12m-6-6v12m12 8h12"/>
    </g>
    <g fill="#4c6273" font-size="17">
      <text x="65" y="132">Interest</text>
      <text x="180" y="132">Popularity</text>
      <text x="295" y="132">Bias</text>
    </g>
    <g fill="none" stroke="#92a9bc" stroke-width="1.6" stroke-linecap="round">
      <path d="M65 143v12q0 8 8 8h99"/>
      <path d="M295 143v12q0 8-8 8H188"/>
      <path d="M180 143v33" marker-end="url(#arrow)"/>
    </g>
    <rect x="72" y="184" width="216" height="36" rx="9" fill="#245b85"/>
    <text x="180" y="208" font-size="18" fill="#ffffff">Recommendation</text>
  </g>
</svg>
